upstream divisors_v1 {
    zone divisors_v1 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=divisors-v1 resolve;
}

upstream divisors_v2 {
    zone divisors_v2 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=divisors-v2 resolve;
}

server {
    listen 80;

    location /v1/divisors/ {
        proxy_pass http://divisors_v1/divisors/;
    }

    location /v2/divisors/ {
        proxy_pass http://divisors_v2/divisors/;
    }

    location / {
        return 404;
    }
}